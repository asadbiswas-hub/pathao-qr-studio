<script>
  // Replace this with your Google Apps Script Web App URL
  const API_URL = https://script.google.com/a/macros/pathao.com/s/AKfycbwZhbLsOOchkrbOmlXGQE8LMR5h0Xx5ndOz9_Vh8XB6rQVzLU7-lQ6GpDn8t_h4GDUVVw/exec;

  let employeeDatabase = [];
  let activeUser = null;

  // Fetch live employee database from Google Sheets
  async function fetchEmployeesFromSheet() {
    try {
      const res = await fetch(API_URL);
      employeeDatabase = await res.json();
      return employeeDatabase;
    } catch (err) {
      console.error("Failed to load DB from Google Sheet", err);
      alert("Error connecting to Database server.");
      return [];
    }
  }

  // Daily Session Check
  async function checkDailySession() {
    const employees = await fetchEmployeesFromSheet();
    const sessionData = localStorage.getItem("pathao_session");

    if (sessionData) {
      const session = JSON.parse(sessionData);
      const now = new Date().getTime();
      const oneDay = 24 * 60 * 60 * 1000; // 24 Hours

      if (now - session.timestamp < oneDay) {
        // Validate user status against Google Sheet DB
        const emp = employees.find(e => e.id.toUpperCase() === session.id.toUpperCase() && e.status === "Active");
        if (emp) {
          grantAccess(emp);
          return;
        }
      }
    }
    // Show Checkpost popup if session is invalid or missing
    document.getElementById("checkpostModal").style.display = "flex";
  }

  async function submitCheckpost() {
    const inputId = document.getElementById("popupIdInput").value.trim().toUpperCase();
    
    // Ensure fresh database lookup on login attempt
    const employees = await fetchEmployeesFromSheet();
    const emp = employees.find(e => e.id.toUpperCase() === inputId && e.status === "Active");

    if (emp) {
      // Save 24-hour Session
      const sessionData = { id: emp.id, name: emp.name, timestamp: new Date().getTime() };
      localStorage.setItem("pathao_session", JSON.stringify(sessionData));
      
      document.getElementById("popupError").style.display = "none";
      document.getElementById("checkpostModal").style.display = "none";
      grantAccess(emp);
    } else {
      document.getElementById("popupError").style.display = "block";
    }
  }

  function grantAccess(emp) {
    activeUser = emp;
    document.getElementById("activeUserDisplay").innerText = `${emp.name} (${emp.id})`;
    document.getElementById("docUserTag").innerText = `Generated By: ${emp.name} (${emp.id})`;
    
    // Show Admin Panel Button if user is marked as Admin in Sheet or has ID M 1825
    if (emp.isAdmin || emp.id.toUpperCase() === "M 1825") {
      document.getElementById("adminBtn").style.display = "block";
    } else {
      document.getElementById("adminBtn").style.display = "none";
    }

    generateBatchQR();
  }

  function clearSession() {
    localStorage.removeItem("pathao_session");
    location.reload();
  }

  // Admin Panel Functions
  async function openAdminModal() {
    await renderAdminTable();
    document.getElementById("adminModal").style.display = "flex";
  }

  function closeAdminModal() {
    document.getElementById("adminModal").style.display = "none";
  }

  async function renderAdminTable() {
    const tbody = document.getElementById("adminTableBody");
    tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>Loading data from Google Sheet...</td></tr>";

    const employees = await fetchEmployeesFromSheet();
    tbody.innerHTML = "";

    employees.forEach((emp) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${emp.name}</td>
        <td><strong>${emp.id}</strong></td>
        <td class="${emp.status === 'Active' ? 'status-active' : 'status-blocked'}">${emp.status}</td>
        <td>
          ${emp.id.toUpperCase() === 'M 1825' ? '<em>System Admin</em>' : `
            <button class="action-btn" style="background-color:${emp.status === 'Active' ? '#EF4444' : '#10B981'}; color:white;" onclick="toggleStatus('${emp.id}')">
              ${emp.status === 'Active' ? 'Block' : 'Unblock'}
            </button>
          `}
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function toggleStatus(empId) {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "toggleStatus", id: empId })
    });
    const result = await res.json();
    if (result.success) {
      await renderAdminTable();
    } else {
      alert(result.message);
    }
  }

  async function addEmployee() {
    const name = document.getElementById("newEmpName").value.trim();
    const id = document.getElementById("newEmpId").value.trim().toUpperCase();

    if (!name || !id) {
      alert("Enter both Name and E - ID!");
      return;
    }

    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "add", name, id })
    });

    const result = await res.json();
    if (result.success) {
      document.getElementById("newEmpName").value = "";
      document.getElementById("newEmpId").value = "";
      await renderAdminTable();
    } else {
      alert(result.message);
    }
  }

  // QR Generation Logic
  function generateBatchQR() {
    const rawText = document.getElementById("bulkInput").value;
    const grid = document.getElementById("qrGrid");
    const itemCountSpan = document.getElementById("itemCount");

    const items = rawText.split('\n').map(item => item.trim()).filter(item => item.length > 0);
    grid.innerHTML = "";
    itemCountSpan.innerText = `${items.length} Tracking Items Total`;

    if (items.length === 0) return;

    items.forEach((codeData, index) => {
      const card = document.createElement("div");
      card.className = "qr-card";

      const qrBox = document.createElement("div");
      qrBox.id = "qr_box_" + index;

      const label = document.createElement("p");
      label.innerText = codeData;

      card.appendChild(qrBox);
      card.appendChild(label);
      grid.appendChild(card);

      new QRCode(qrBox, { text: codeData, width: 90, height: 90, correctLevel: QRCode.CorrectLevel.M });
    });
  }

    checkDailySession();

</script>
